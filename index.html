    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&family=DM+Mono&family=DM+Serif+Display&family=Exo+2:wght@400;700&family=IBM+Plex+Mono&family=Inter:wght@400;700&family=Lato&family=Nunito&family=Orbitron:wght@700;900&family=Oswald&family=Oxanium&family=Playfair+Display&family=Poppins&family=Press+Start+2P&family=Quicksand&family=Rajdhani:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&family=Share+Tech+Mono&family=Space+Grotesk&family=Space+Mono:wght@400;700&family=Work+Sans&family=Zen+Tokyo+Zoo&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: #05080a;
        color: #e2e8f0;
        overflow-x: hidden;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0f14; 
      }
      ::-webkit-scrollbar-thumb {
        background: #00fff7; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ff00b8; 
      }

      /* Global Animations */
      @keyframes hud-boot {
        0% { opacity: 0; transform: translateY(10px); filter: blur(4px); }
        100% { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      
      .screen-enter {
        animation: hud-boot 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes pan {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
      }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 5px currentColor; }
        50% { box-shadow: 0 0 15px currentColor; }
      }

      /* Utility Classes */
      .bg-grid {
        background-image:
          linear-gradient(to right, rgba(0, 255, 247, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 255, 247, 0.05) 1px, transparent 1px);
      }
      
      .text-glow {
        text-shadow: 0 0 10px currentColor;
      }

      .clip-corner-br {
         clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
      }
    </style>
